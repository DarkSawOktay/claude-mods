name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  mods:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mod: [suivi-conso, ou-on-en-est, garde-prod, apk-fraicheur]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - name: Validate the mod
        run: claude plugin validate ${{ matrix.mod }}
      - name: Run the tests
        run: claude plugin test ${{ matrix.mod }}
